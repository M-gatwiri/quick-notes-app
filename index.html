<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Your Personal Notes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <h1>QuickNotes</h1>
    <p>Your thoughts, organised in one place.</p>
</header>

<main>
    <section id="add-note-section">
        <h2>Add a Note</h2>

        <form id="note-form">
            <label for="note-input">Your Note</label>
            <input
                type="text"
                id="note-input"
                placeholder="Write your note here..."
            >

            <label for="note-category">Choose a Category</label>
            <select id="note-category">
                <option value="Personal">Personal</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
            </select>

            <button type="submit">Add Note</button>
        </form>

        <p id="error-message"></p>
    </section>

    <section id="your-notes-section">
        <h2>Your Notes</h2>

        <label for="search-input">Search your notes</label>
        <input
            type="search"
            id="search-input"
            placeholder="Search notes..."
        >

        <p id="note-count">You have no notes yet.</p>

        <ul id="notes-list"></ul>
    </section>
</main>

<footer>
    <p>QuickNotes &copy; 2026 | Keep your thoughts organised.</p>
</footer>

</body>
</html>
